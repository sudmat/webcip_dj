# WebCIP at https://<host>/webcip/, alongside the existing PHP site at /.
#
#   a2enmod proxy proxy_http
#   cp deploy/apache-webcip.conf /etc/apache2/conf-available/webcip.conf
#   a2enconf webcip && apachectl configtest && systemctl reload apache2
#
# Apache proxies the WHOLE subtree and strips the prefix; uvicorn serves both the SPA and /api,
# exactly as it does locally. One rule, and local and production run identical code.
#
# NOTE: if the PHP site uses a mod_rewrite front controller, it must not swallow /webcip. Add
#   RewriteCond %{REQUEST_URI} !^/webcip
# to its rules, or a `RewriteRule ^/webcip - [L]` ahead of them.

# The SPA's asset URLs are RELATIVE (vite base './'), so they resolve against the DIRECTORY of
# the document URL. Without this redirect, /webcip resolves them against / and every one lands
# on the PHP site — which answers 200 with HTML, so the failure looks like a parse error rather
# than a 404. This line is load-bearing.
RedirectMatch 301 "^/webcip$" "/webcip/"

ProxyRequests     Off
ProxyPreserveHost On
# A pipeline step runs a docker tool for minutes; the SSE stream stays open for the whole run.
ProxyTimeout      1800

ProxyPass        "/webcip/" "http://127.0.0.1:8011/" timeout=1800 retry=0
ProxyPassReverse "/webcip/" "http://127.0.0.1:8011/"

<Location "/webcip/">
    # A CT upload is ~350 MB. The default is unlimited; state the ceiling explicitly.
    LimitRequestBody 1073741824
</Location>

# The progress stream must not be buffered or compressed. text/event-stream is not in Apache's
# default deflate type list and the backend already sends Content-Encoding: identity — this is
# defence against a later edit to either.
<LocationMatch "^/webcip/api/auto/[^/]+/events$">
    SetEnv no-gzip 1
    SetEnv dont-vary 1
</LocationMatch>

# The app is deployed to /opt/webcip, NOT under DocumentRoot. If an old copy is still on disk
# there, it must 404 rather than serve uploads/ as static files.
<Directory "/var/www/html/webcip">
    Require all denied
</Directory>

# There is no authentication in front of this yet — see SERVER_SETUP.md, "Not done yet".
